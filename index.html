<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The North Star: Teacher Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .toast {
            visibility: hidden;
            min-width: 300px;
            background-color: #1e293b;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 16px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-weight: 600;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-6">

    <div class="max-w-7xl mx-auto" id="app"></div>
    <div id="toast" class="toast">
        <div class="flex items-center justify-center gap-2">
            <i data-lucide="check-circle" class="w-5 h-5 text-green-400"></i>
            <span>Context-Rich Prompt Copied!</span>
        </div>
    </div>

    <script>
        // --- CONTEXT-RICH PROMPT GENERATOR ---
        const generatePrompt = (week, topic, game, unitFocus) => {
            return `ACT AS: An expert Instructional Designer for Neurodiverse Students (ADHD/Dyslexia).
CONTEXT: I am teaching 9th Grade Civics at Palmer High School. My students have low reading stamina (approx 6th-grade level).
CURRENT UNIT: ${unitFocus}
THIS WEEK'S TOPIC: "${topic}"
ANCHOR GAME: "${game}"

TASK: Create a "Realist" Lesson Plan for this week following my strict operational rhythm.

MONDAY (27 MIN - THE HOOK):
- Goal: Visual Vocabulary & Engagement.
- Output 1: Describe 3 distinct, concrete images I should put on the screen to represent "${topic}" (No abstract concepts, use real-world metaphors).
- Output 2: Provide ONE key vocabulary term and a "sticky" definition (5 words or less).

WEDNESDAY (100 MIN - THE INPUT):
- Goal: Content & Simulation.
- Output 1: Suggest a specific YouTube video (Crash Course/TedEd) but specify a 5-minute segment timestamp that is accessible.
- Output 2: "Game Cheat Sheet": Give me 3 "Tips for Success" for the students playing "${game}" so they don't get frustrated.
- Output 3: A simple "Check for Understanding" question I can ask halfway through the block.

FRIDAY (100 MIN - THE OUTPUT):
- Goal: Synthesis & Creation.
- Output: Create a checklist for a "One-Pager" assignment about ${topic}. It must have exactly 4 requirements (e.g., "Draw X", "Define Y", "List 3 examples of Z").

TONE: Encouraging, structured, and low-cognitive-load.`;
        };

        // --- DATA ---
        const beat = [
            { day: 'MON', time: '27m', title: 'The Hook', icon: 'zap', desc: 'Visuals & Vocab' },
            { day: 'WED', time: '100m', title: 'The Input', icon: 'gamepad-2', desc: 'Watch & Play' },
            { day: 'FRI', time: '100m', title: 'The Output', icon: 'file-text', desc: 'Create & Reward' }
        ];

        const units = [
            {
                id: 'unit1',
                title: 'UNIT 1: POWER',
                subtitle: 'Who is the boss of me?',
                weeks: 'Weeks 1–6',
                icon: 'zap',
                colorClass: 'bg-amber-600',
                lightColorClass: 'bg-amber-50',
                borderColorClass: 'border-amber-200',
                textColorClass: 'text-amber-800',
                focus: 'Federalism & 3 Branches',
                description: 'Focus on the rules. The "Cake" (Federalism) and Rock-Paper-Scissors (Checks & Balances).',
                weeklyData: [
                    { week: 1, topic: 'The Boss: Intro to Power', game: 'Win the White House', url: 'https://www.icivics.org/games/win-white-house' },
                    { week: 2, topic: 'Federalism (The Cake)', game: 'Power Play', url: 'https://www.icivics.org/games/power-play' },
                    { week: 3, topic: 'The 3 Branches', game: 'Branches of Power', url: 'https://www.icivics.org/games/branches-power' },
                    { week: 4, topic: 'How a Bill Becomes Law', game: 'LawCraft', url: 'https://www.icivics.org/games/lawcraft' },
                    { week: 5, topic: 'The Executive Branch', game: 'Executive Command', url: 'https://www.icivics.org/games/executive-command' },
                    { week: 6, topic: 'Unit Wrap / Local Reps', game: 'Represent Me', url: 'https://www.icivics.org/games/represent-me' }
                ]
            },
            {
                id: 'unit2',
                title: 'UNIT 2: RIGHTS',
                subtitle: "What can I do that they can't stop?",
                weeks: 'Weeks 7–12',
                icon: 'shield',
                colorClass: 'bg-blue-600',
                lightColorClass: 'bg-blue-50',
                borderColorClass: 'border-blue-200',
                textColorClass: 'text-blue-800',
                focus: 'Bill of Rights & Limits',
                description: 'Focus on protections. Speech, Guns, Search & Seizure, and the right to remain silent.',
                weeklyData: [
                    { week: 7, topic: 'Freedom of Speech', game: 'Do I Have a Right?', url: 'https://www.icivics.org/games/do-i-have-right' },
                    { week: 8, topic: 'Gun Rights (2nd Amend)', game: 'Constitutional Compromise', url: 'https://www.icivics.org/games/constitutional-compromise' },
                    { week: 9, topic: 'Search & Seizure (4th)', game: 'Argument Wars (T.L.O.)', url: 'https://www.icivics.org/games/argument-wars' },
                    { week: 10, topic: 'Due Process (5th/6th)', game: 'Court Quest', url: 'https://www.icivics.org/games/court-quest' },
                    { week: 11, topic: 'Civil Rights Cases', game: 'Argument Wars (Brown v Board)', url: 'https://www.icivics.org/games/argument-wars' },
                    { week: 12, topic: 'Unit Wrap / Assessment', game: 'Supreme Decision', url: 'https://www.icivics.org/games/supreme-decision' }
                ]
            },
            {
                id: 'unit3',
                title: 'UNIT 3: ACTION',
                subtitle: 'How do I fix my block?',
                weeks: 'Weeks 13–18',
                icon: 'map-pin',
                colorClass: 'bg-emerald-600',
                lightColorClass: 'bg-emerald-50',
                borderColorClass: 'border-emerald-200',
                textColorClass: 'text-emerald-800',
                focus: 'Local Problems & Solutions',
                description: 'Focus on the neighborhood. Potholes, lights, trash. Using the "GoCOS!" App methodology.',
                weeklyData: [
                    { week: 13, topic: 'The Civic Walk', game: 'Maps: Observation Mode', url: 'https://www.google.com/maps' },
                    { week: 14, topic: 'Who do you call?', game: 'Counties Work', url: 'https://www.icivics.org/games/counties-work' },
                    { week: 15, topic: 'Mock Report: GoCOS!', game: 'Download GoCOS!', url: 'https://coloradosprings.gov/gocos' },
                    { week: 16, topic: 'The Fix: Solutions', game: 'Local Council Sim', url: 'https://www.icivics.org/games/counties-work' },
                    { week: 17, topic: 'Project Assembly', game: 'Production Studio', url: '' },
                    { week: 18, topic: 'Civic Audit Showcase', game: 'Final Defense', url: '' }
                ]
            }
        ];

        let selectedUnitId = 'unit1';
        let expandedWeek = null; // Tracks which week is open

        function render() {
            const app = document.getElementById('app');
            const currentUnit = units.find(u => u.id === selectedUnitId);

            app.innerHTML = `
                <!-- HEADER: Survival Stats -->
                <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 mb-6">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <div class="flex items-center gap-2 mb-1 text-indigo-600">
                                <i data-lucide="compass" class="w-5 h-5"></i>
                                <span class="text-xs font-bold uppercase tracking-widest text-slate-500">Teacher Command Center</span>
                            </div>
                            <h1 class="text-3xl font-extrabold text-slate-900">The North Star</h1>
                            <p class="text-slate-600 mt-1">Palmer High School • Spring 2026</p>
                        </div>
                        <div class="flex gap-3">
                            <div class="bg-slate-50 px-4 py-2 rounded-xl text-center border border-slate-100">
                                <span class="block text-[10px] font-bold text-slate-400 uppercase">Lexile</span>
                                <span class="font-bold text-indigo-600 text-sm">600L</span>
                            </div>
                            <div class="bg-slate-50 px-4 py-2 rounded-xl text-center border border-slate-100">
                                <span class="block text-[10px] font-bold text-slate-400 uppercase">Reward</span>
                                <span class="font-bold text-indigo-600 text-sm">Block Pts</span>
                            </div>
                            <a href="https://chat.openai.com" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-colors shadow-sm">
                                <i data-lucide="bot" class="w-4 h-4"></i> 
                                <span>AI Assistant</span>
                            </a>
                        </div>
                    </div>
                </header>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    
                    <!-- LEFT: The Weekly Beat (Template) -->
                    <div class="lg:col-span-3 space-y-4">
                        <div class="flex items-center gap-2 px-1 mb-2">
                            <i data-lucide="clock" class="w-4 h-4 text-slate-400"></i>
                            <h3 class="text-xs font-bold uppercase text-slate-500 tracking-widest">Operational Rhythm</h3>
                        </div>
                        ${beat.map(b => `
                            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                <div class="flex items-center gap-3 mb-2">
                                    <div class="p-2 rounded-lg bg-slate-100 text-slate-600">
                                        <i data-lucide="${b.icon}" class="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <div class="text-xs font-bold text-slate-400">${b.day} • ${b.time}</div>
                                        <div class="font-bold text-slate-800">${b.title}</div>
                                    </div>
                                </div>
                                <div class="text-xs text-slate-500 pl-11">${b.desc}</div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- RIGHT: Unit Content -->
                    <div class="lg:col-span-9">
                        
                        <!-- Unit Tabs -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
                            ${units.map(unit => {
                                const isSelected = unit.id === selectedUnitId;
                                const borderClass = isSelected ? `${unit.borderColorClass} ring-2 ring-offset-2 ring-${unit.colorClass.replace('bg-', '')}` : 'border-transparent hover:border-slate-200';
                                const bgClass = isSelected ? `${unit.lightColorClass}` : 'bg-white hover:bg-slate-50';
                                const textClass = isSelected ? unit.textColorClass : 'text-slate-600';
                                
                                return `
                                <button onclick="setUnit('${unit.id}')" 
                                    class="p-4 rounded-xl border-2 transition-all duration-200 text-left group ${borderClass} ${bgClass} shadow-sm w-full">
                                    <div class="flex justify-between items-start mb-2">
                                        <i data-lucide="${unit.icon}" class="w-5 h-5 ${textClass}"></i>
                                        <span class="text-[10px] font-bold uppercase px-2 py-1 rounded-full bg-white/60 text-slate-600">
                                            ${unit.weeks}
                                        </span>
                                    </div>
                                    <div class="font-black text-lg ${textClass}">${unit.title}</div>
                                </button>
                                `;
                            }).join('')}
                        </div>

                        <!-- Active Unit Display -->
                        <div class="bg-white rounded-2xl border-2 ${currentUnit.borderColorClass} overflow-hidden shadow-sm">
                            <div class="${currentUnit.lightColorClass} p-6 border-b ${currentUnit.borderColorClass}">
                                <h2 class="text-3xl font-black mb-2 ${currentUnit.textColorClass}">${currentUnit.title}</h2>
                                <p class="text-lg font-medium text-slate-700 mb-4">"${currentUnit.subtitle}"</p>
                                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/60 border border-white/50 text-xs font-bold text-slate-600">
                                    <i data-lucide="crosshair" class="w-3 h-3"></i>
                                    Unit Focus: ${currentUnit.focus}
                                </div>
                            </div>

                            <div>
                                <div class="bg-slate-50/80 px-6 py-3 border-b border-slate-100 text-[10px] font-bold uppercase text-slate-400 flex justify-between">
                                    <span>Weekly Breakdown</span>
                                    <span>Tools</span>
                                </div>
                                ${currentUnit.weeklyData.map(wk => {
                                    const isExpanded = expandedWeek === wk.week;
                                    const promptText = generatePrompt(wk.week, wk.topic, wk.game, currentUnit.title);
                                    const safePrompt = promptText.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/\n/g, '\\n');

                                    return `
                                    <div class="border-b border-slate-100 last:border-0 transition-all duration-300 ${isExpanded ? 'bg-slate-50' : 'bg-white hover:bg-slate-50'}">
                                        
                                        <!-- Weekly Row Header -->
                                        <div onclick="toggleWeek(${wk.week})" class="cursor-pointer px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                            <div class="flex items-center gap-4">
                                                <span class="flex-shrink-0 w-8 h-8 rounded-full ${isExpanded ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500'} font-bold flex items-center justify-center text-sm transition-colors">
                                                    ${wk.week}
                                                </span>
                                                <span class="font-bold text-slate-800 text-base">
                                                    ${wk.topic}
                                                </span>
                                            </div>
                                            
                                            <div class="flex items-center gap-2">
                                                <button onclick="event.stopPropagation(); copyToClipboard(\`${safePrompt}\`)" 
                                                    class="flex items-center gap-2 text-xs font-bold px-3 py-1.5 rounded-full bg-purple-100 text-purple-700 hover:bg-purple-200 hover:shadow-sm transition-all border border-purple-200 group"
                                                    title="Copy AI Prompt">
                                                    <i data-lucide="wand-2" class="w-3 h-3 group-hover:rotate-12 transition-transform"></i>
                                                    <span class="hidden sm:inline">AI Prep</span>
                                                </button>
                                                
                                                <i data-lucide="${isExpanded ? 'chevron-up' : 'chevron-down'}" class="w-4 h-4 text-slate-300 ml-2"></i>
                                            </div>
                                        </div>

                                        <!-- Expanded Detail View -->
                                        ${isExpanded ? `
                                            <div class="px-6 pb-6 pt-2 border-t border-slate-100/50 animate-in fade-in slide-in-from-top-2 duration-200">
                                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                    <!-- Monday Detail -->
                                                    <div class="bg-white border border-slate-200 p-3 rounded-lg">
                                                        <div class="flex items-center gap-2 mb-2 text-amber-600">
                                                            <i data-lucide="zap" class="w-3 h-3"></i>
                                                            <span class="text-[10px] font-bold uppercase">Monday: Hook</span>
                                                        </div>
                                                        <ul class="text-xs text-slate-600 space-y-1 list-disc list-inside">
                                                            <li>Visual Vocab: "What is ${wk.topic}?"</li>
                                                            <li>3 Images Connection</li>
                                                            <li>Exit Ticket: Sticky Note</li>
                                                        </ul>
                                                    </div>

                                                    <!-- Wednesday Detail -->
                                                    <div class="bg-white border border-slate-200 p-3 rounded-lg">
                                                        <div class="flex items-center gap-2 mb-2 text-rose-600">
                                                            <i data-lucide="gamepad-2" class="w-3 h-3"></i>
                                                            <span class="text-[10px] font-bold uppercase">Wednesday: Input</span>
                                                        </div>
                                                        <ul class="text-xs text-slate-600 space-y-1 list-disc list-inside">
                                                            <li>Video Lab: ${wk.topic} Intro</li>
                                                            <li><strong>Game: ${wk.game}</strong></li>
                                                            ${wk.url ? `<a href="${wk.url}" target="_blank" class="mt-2 block text-center bg-rose-50 text-rose-700 py-1 rounded font-bold hover:bg-rose-100">Launch Game &rarr;</a>` : ''}
                                                        </ul>
                                                    </div>

                                                    <!-- Friday Detail -->
                                                    <div class="bg-white border border-slate-200 p-3 rounded-lg">
                                                        <div class="flex items-center gap-2 mb-2 text-emerald-600">
                                                            <i data-lucide="file-text" class="w-3 h-3"></i>
                                                            <span class="text-[10px] font-bold uppercase">Friday: Output</span>
                                                        </div>
                                                        <ul class="text-xs text-slate-600 space-y-1 list-disc list-inside">
                                                            <li>One-Pager: ${wk.topic}</li>
                                                            <li>4-Quadrant Summary</li>
                                                            <li><strong>Reward: Block Points</strong></li>
                                                        </ul>
                                                    </div>
                                                </div>
                                            </div>
                                        ` : ''}

                                    </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        window.setUnit = (id) => { selectedUnitId = id; expandedWeek = null; render(); };
        window.toggleWeek = (week) => { expandedWeek = (expandedWeek === week) ? null : week; render(); };
        
        window.copyToClipboard = (text) => {
            const txt = document.createElement("textarea");
            txt.innerHTML = text;
            const decodedText = txt.value;
            
            navigator.clipboard.writeText(decodedText).then(() => {
                const toast = document.getElementById('toast');
                toast.className = "toast show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
            });
        };

        render();
    </script>
</body>
</html>
